name: Build desktop downloads

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmdream-studio/package-lock.json
      - run: npm ci
        working-directory: cmdream-studio
      - run: npm test
        working-directory: cmdream-studio
      - name: Build Windows installer and portable packages
        run: npm run dist:windows
        working-directory: cmdream-studio
      - uses: actions/upload-artifact@v4
        with:
          name: windows-downloads
          path: cmdream-studio/release/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmdream-studio/package-lock.json
      - name: Install AppImage runtime dependency
        run: sudo apt-get update && sudo apt-get install -y libfuse2
      - run: npm ci
        working-directory: cmdream-studio
      - run: npm test
        working-directory: cmdream-studio
      - name: Build Linux AppImage
        run: npm run dist:linux
        working-directory: cmdream-studio
      - uses: actions/upload-artifact@v4
        with:
          name: linux-downloads
          path: |
            cmdream-studio/release/*.AppImage
            cmdream-studio/release/*.deb
          if-no-files-found: error
          retention-days: 14

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmdream-studio/package-lock.json
      - run: npm ci
        working-directory: cmdream-studio
      - run: npm test
        working-directory: cmdream-studio
      - name: Build Intel and Apple silicon apps
        run: npm run dist:mac
        working-directory: cmdream-studio
      - uses: actions/upload-artifact@v4
        with:
          name: macos-downloads
          path: |
            cmdream-studio/release/*.dmg
            cmdream-studio/release/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: windows-downloads
          path: cmdream-studio/release
      - uses: actions/download-artifact@v4
        with:
          name: linux-downloads
          path: cmdream-studio/release
      - uses: actions/download-artifact@v4
        with:
          name: macos-downloads
          path: cmdream-studio/release
      - name: Confirm release version matches the tag
        working-directory: cmdream-studio
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "v$PACKAGE_VERSION" = "$GITHUB_REF_NAME"
      - name: Prepare the GitHub Release download catalog
        run: npm run update:release-catalog
        working-directory: cmdream-studio
        env:
          REQUIRE_ALL_DOWNLOADS: "1"
      - name: Create GitHub Release and upload desktop downloads
        run: |
          shopt -s nullglob
          files=(cmdream-studio/release/*)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "CMDream Studio $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit public download catalog
        working-directory: cmdream-studio
        run: |
          catalog_file="$RUNNER_TEMP/product-info.json"
          cp src/product-info.json "$catalog_file"
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" FETCH_HEAD
          cp "$catalog_file" src/product-info.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/product-info.json
          if git diff --cached --quiet; then
            echo "Download catalog already matches this release."
          else
            git commit -m "Publish CMDream Studio $GITHUB_REF_NAME downloads"
            git push origin "$DEFAULT_BRANCH"
          fi
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
