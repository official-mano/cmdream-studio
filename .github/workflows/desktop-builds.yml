name: Build desktop downloads

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmdream-studio/package-lock.json
      - run: npm ci
        working-directory: cmdream-studio
      - run: npm test
        working-directory: cmdream-studio
      - name: Build Windows installer and portable packages
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL }}
        run: npm run dist:windows
        working-directory: cmdream-studio
      - uses: actions/upload-artifact@v4
        with:
          name: windows-downloads
          path: cmdream-studio/release/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmdream-studio/package-lock.json
      - name: Install AppImage runtime dependency
        run: sudo apt-get update && sudo apt-get install -y libfuse2
      - run: npm ci
        working-directory: cmdream-studio
      - run: npm test
        working-directory: cmdream-studio
      - name: Build Linux AppImage
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL }}
        run: npm run dist:linux
        working-directory: cmdream-studio
      - uses: actions/upload-artifact@v4
        with:
          name: linux-downloads
          path: cmdream-studio/release/*.AppImage
          if-no-files-found: error
          retention-days: 14
