name: Build desktop downloads

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmdream-studio/package-lock.json
      - run: npm ci
        working-directory: cmdream-studio
      - run: npm test
        working-directory: cmdream-studio
      - run: npm run dist:windows
        working-directory: cmdream-studio
      - uses: actions/upload-artifact@v4
        with:
          name: windows-downloads
          path: cmdream-studio/release/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmdream-studio/package-lock.json
      - name: Install AppImage runtime dependency
        run: sudo apt-get update && sudo apt-get install -y libfuse2
      - run: npm ci
        working-directory: cmdream-studio
      - run: npm test
        working-directory: cmdream-studio
      - run: npm run dist:linux
        working-directory: cmdream-studio
      - uses: actions/upload-artifact@v4
        with:
          name: linux-downloads
          path: cmdream-studio/release/*.AppImage
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-downloads"
          path: release-files
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-files/* --clobber
          else
            gh release create "$TAG_NAME" release-files/* --title "$TAG_NAME" --generate-notes
          fi
